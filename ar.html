<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AR Maracujá</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
      font-family:Arial, sans-serif;
    }

    #painel{
      position:fixed;
      left:50%;
      bottom:115px;
      transform:translateX(-50%);
      width:90%;
      max-width:420px;
      background:rgba(0,0,0,.88);
      color:white;
      padding:18px;
      border-radius:18px;
      text-align:center;
      display:none;
      z-index:9999;
    }

    #painel h2{
      color:#ffd54f;
      margin-bottom:8px;
    }

    #painel button{
      margin-top:12px;
      padding:10px 20px;
      border:none;
      border-radius:20px;
      background:#7a4bb3;
      color:white;
      font-weight:bold;
    }

    .menu-ar{
      position:fixed;
      left:0;
      bottom:0;
      width:100%;
      background:rgba(0,0,0,.82);
      padding:12px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      z-index:9998;
    }

    .menu-ar button{
      border:none;
      border-radius:14px;
      padding:12px 5px;
      font-weight:bold;
      color:white;
      background:#4CAF50;
      font-size:13px;
    }

    .menu-ar button:nth-child(2){
      background:#FF9800;
    }

    .menu-ar button:nth-child(3){
      background:#7A4BB3;
    }

    .menu-ar button:nth-child(4){
      background:#2196F3;
    }
  </style>
</head>

<body>

<div id="painel">
  <h2 id="titulo"></h2>
  <p id="texto"></p>
  <button onclick="fecharPainel()">Fechar</button>
</div>

<div class="menu-ar">
  <button onclick="mostrarInfo('flor')">🌸 Flor</button>
  <button onclick="mostrarInfo('polinizacao')">🐝 Polinização</button>
  <button onclick="mostrarInfo('beneficios')">🧪 Benefícios</button>
  <button onclick="mostrarInfo('curiosidades')">🍹 Curiosidades</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <a-marker preset="hiro">

    <a-image
      src="images/maracuja.png"
      position="0 0 0"
      rotation="-90 0 0"
      width="3"
      height="3">
    </a-image>

    <a-text
      value="MARACUJA"
      position="-1.2 1.7 0"
      rotation="-90 0 0"
      color="#FFD700"
      scale="1 1 1">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
  const dados = {
    flor: {
      titulo: "🌸 Flor do Maracujá",
      texto: "A flor do maracujá é essencial para formar o fruto. Ela precisa ser polinizada para gerar o maracujá."
    },
    polinizacao: {
      titulo: "🐝 Polinização",
      texto: "A polinização pode ser feita por insetos, principalmente abelhas grandes chamadas mamangavas."
    },
    beneficios: {
      titulo: "🧪 Benefícios",
      texto: "O maracujá possui vitaminas, fibras e antioxidantes, podendo fazer parte de uma alimentação equilibrada."
    },
    curiosidades: {
      titulo: "🍹 Curiosidades",
      texto: "O maracujá é muito usado em sucos, doces, mousses e produtos naturais. O Brasil é um grande produtor da fruta."
    }
  };

  const painel = document.getElementById("painel");
  const titulo = document.getElementById("titulo");
  const texto = document.getElementById("texto");

  function mostrarInfo(tipo){
    titulo.textContent = dados[tipo].titulo;
    texto.textContent = dados[tipo].texto;
    painel.style.display = "block";
  }

  function fecharPainel(){
    painel.style.display = "none";
  }
</script>

</body>
</html>
