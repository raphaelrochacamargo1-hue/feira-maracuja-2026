<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AR Maracujá Interativo</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .painel {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 20px;
      border-radius: 18px;
      display: none;
      z-index: 9999;
      text-align: center;
    }

    .painel h2 {
      color: #ffd54f;
      margin-bottom: 10px;
    }

    .painel button {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      background: #7a4bb3;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="painel" id="painel">
  <h2 id="tituloPainel"></h2>
  <p id="textoPainel"></p>
  <button onclick="fecharPainel()">Fechar</button>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <a-image 
      src="images/maracuja.png"
      position="0 0.6 0"
      rotation="-90 0 0"
      width="2.6"
      height="2.6"
      animation="property: rotation; to: -90 360 0; loop: true; dur: 8000">
    </a-image>

    <a-text
      value="MARACUJA"
      position="-1.1 1.7 0"
      rotation="-90 0 0"
      color="#FFD700"
      scale="1.2 1.2 1.2">
    </a-text>

    <a-circle
      class="botaoAR"
      data-tipo="flor"
      position="-1.4 0.1 0"
      rotation="-90 0 0"
      radius="0.28"
      color="#4CAF50">
    </a-circle>

    <a-text
      value="Flor"
      position="-1.65 0.1 0.05"
      rotation="-90 0 0"
      color="white"
      scale="0.45 0.45 0.45">
    </a-text>

    <a-circle
      class="botaoAR"
      data-tipo="beneficios"
      position="1.4 0.1 0"
      rotation="-90 0 0"
      radius="0.28"
      color="#7A4BB3">
    </a-circle>

    <a-text
      value="Beneficios"
      position="1.05 0.1 0.05"
      rotation="-90 0 0"
      color="white"
      scale="0.4 0.4 0.4">
    </a-text>

    <a-circle
      class="botaoAR"
      data-tipo="polinizacao"
      position="-1.4 1.1 0"
      rotation="-90 0 0"
      radius="0.28"
      color="#FF9800">
    </a-circle>

    <a-text
      value="Polinizacao"
      position="-1.82 1.1 0.05"
      rotation="-90 0 0"
      color="white"
      scale="0.38 0.38 0.38">
    </a-text>

    <a-circle
      class="botaoAR"
      data-tipo="curiosidades"
      position="1.4 1.1 0"
      rotation="-90 0 0"
      radius="0.28"
      color="#2196F3">
    </a-circle>

    <a-text
      value="Curiosidades"
      position="0.95 1.1 0.05"
      rotation="-90 0 0"
      color="white"
      scale="0.36 0.36 0.36">
    </a-text>

  </a-marker>

  <a-entity camera>
    <a-cursor></a-cursor>
  </a-entity>

</a-scene>

<script>
  const textos = {
    flor: {
      titulo: "🌱 Flor do Maracujá",
      texto: "A flor do maracujá é importante para a formação do fruto. Ela depende da polinização para gerar o maracujá."
    },
    beneficios: {
      titulo: "🧪 Benefícios",
      texto: "O maracujá possui vitaminas, fibras e antioxidantes. Ele pode fazer parte de uma alimentação equilibrada."
    },
    polinizacao: {
      titulo: "🐝 Polinização",
      texto: "A polinização do maracujá pode ser feita por insetos, principalmente abelhas grandes como as mamangavas."
    },
    curiosidades: {
      titulo: "🍹 Curiosidades",
      texto: "O maracujá é muito usado em sucos, doces, mousses e produtos naturais. O Brasil é um grande produtor da fruta."
    }
  };

  const botoes = document.querySelectorAll(".botaoAR");
  const painel = document.getElementById("painel");
  const tituloPainel = document.getElementById("tituloPainel");
  const textoPainel = document.getElementById("textoPainel");

  botoes.forEach(botao => {
    botao.addEventListener("click", () => {
      const tipo = botao.getAttribute("data-tipo");

      tituloPainel.textContent = textos[tipo].titulo;
      textoPainel.textContent = textos[tipo].texto;
      painel.style.display = "block";
    });
  });

  function fecharPainel(){
    painel.style.display = "none";
  }
</script>

</body>
</html>
