<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>AR Maracujá</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
      font-family:Arial, sans-serif;
    }

    #painel{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.85);
      color:white;
      width:90%;
      max-width:420px;
      padding:18px;
      border-radius:18px;
      text-align:center;
      display:none;
      z-index:9999;
    }

    #painel h2{
      color:#ffd54f;
    }

    #painel button{
      margin-top:12px;
      padding:10px 20px;
      border:none;
      border-radius:20px;
      background:#7a4bb3;
      color:white;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div id="painel">
  <h2 id="titulo"></h2>
  <p id="texto"></p>
  <button onclick="fecharPainel()">Fechar</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
   <a-marker preset="hiro">

  <a-image
    src="images/maracuja.png"
    position="0 0 0"
    rotation="-90 0 0"
    width="3"
    height="3">
  </a-image>

  <a-text
    value="MARACUJA"
    position="-1.2 1.7 0"
    rotation="-90 0 0"
    color="#FFD700"
    scale="1 1 1">
  </a-text>

</a-marker>

  <a-entity camera cursor="rayOrigin: mouse"></a-entity>

</a-scene>

<script>
  const dados = {
    flor: {
      titulo: "🌱 Flor do Maracujá",
      texto: "A flor do maracujá é essencial para formar o fruto. Ela precisa ser polinizada para gerar o maracujá."
    },
    beneficios: {
      titulo: "🧪 Benefícios",
      texto: "O maracujá possui vitaminas, fibras e antioxidantes, podendo fazer parte de uma alimentação equilibrada."
    },
    polinizacao: {
      titulo: "🐝 Polinização",
      texto: "A polinização pode ser feita por insetos, principalmente abelhas grandes chamadas mamangavas."
    },
    curiosidades: {
      titulo: "🍹 Curiosidades",
      texto: "O maracujá é muito usado em sucos, doces, mousses e produtos naturais. O Brasil é um grande produtor da fruta."
    }
  };

  const painel = document.getElementById("painel");
  const titulo = document.getElementById("titulo");
  const texto = document.getElementById("texto");

  document.querySelectorAll(".botaoAR").forEach(botao => {
    botao.addEventListener("click", () => {
      const tipo = botao.getAttribute("data-tipo");

      titulo.textContent = dados[tipo].titulo;
      texto.textContent = dados[tipo].texto;
      painel.style.display = "block";
    });
  });

  function fecharPainel(){
    painel.style.display = "none";
  }
</script>

</body>
</html>
