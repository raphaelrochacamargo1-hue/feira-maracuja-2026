<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Maracujá Experience</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/camera.css">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body>

  <div class="topo-ar">
    <a href="../index.html">← Voltar</a>
    <h1>Maracujá AR</h1>
    <button onclick="mostrarCuriosidade()">Info</button>
  </div>

  <div id="popupCuriosidade">
    🍈 <strong>Maracujá</strong>
    <p>
      O maracujá é rico em vitamina C, antioxidantes e fibras.
      Ele também é muito conhecido pelo seu aroma marcante e uso em sucos,
      doces e receitas naturais.
    </p>
    <button onclick="fecharCuriosidade()">Fechar</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-marker preset="hiro">

      <a-image
        src="../assets/ar/maracuja.png"
        position="0 0 0"
        rotation="-90 0 0"
        width="3"
        height="3"
        class="clickable"
        onclick="mostrarCuriosidade()"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 12000; easing: linear;"
        animation__pulse="property: scale; dir: alternate; dur: 1600; loop: true; to: 1.08 1.08 1.08; easing: easeInOutSine;">
      </a-image>

      <a-text
        value="MARACUJA"
        position="-1.2 1.7 0"
        rotation="-90 0 0"
        color="#FFD700"
        scale="1 1 1">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <audio id="somClique" src="../sounds/toque.mp3"></audio>

  <script src="../js/camera.js"></script>

</body>
</html>
