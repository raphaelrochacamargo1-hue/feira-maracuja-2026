<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Maracujá Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/camera.css">

  <link rel="stylesheet" href="../css/camera.css">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body>

<div class="topo-ar">
  <a href="../index.html">← Voltar</a>
  <h1>Maracujá AR</h1>
  <a href="quiz.html">Quiz →</a>
</div>

<div id="painel">
  <h2 id="titulo"></h2>
  <p id="texto"></p>
  <button onclick="fecharPainel()">Fechar</button>
</div>

<div class="menu-ar">
  <button onclick="mostrarInfo('flor')">🌸<span>Flor</span></button>
  <button onclick="mostrarInfo('polinizacao')">🐝<span>Polinização</span></button>
  <button onclick="mostrarInfo('beneficios')">🧪<span>Benefícios</span></button>
  <button onclick="mostrarInfo('curiosidades')">🍹<span>Curiosidades</span></button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <a-marker preset="hiro">

    <a-image
      src="../../images/maracuja.png"
      position="0 0 0"
      rotation="-90 0 0"
      width="3"
      height="3">
    </a-image>

    <a-text
      value="MARACUJA"
      position="-1.2 1.7 0"
      rotation="-90 0 0"
      color="#FFD700"
      scale="1 1 1">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<nav class="bottom-nav">
  <a href="../index.html">🏠<span>Início</span></a>
  <a href="camera.html" class="ativo">📷<span>AR</span></a>
  <a href="quiz.html">🎮<span>Quiz</span></a>
  <a href="certificado.html">🏆<span>Certificado</span></a>
</nav>
<script src="../js/camera.js"></script>
</body>
</html>
